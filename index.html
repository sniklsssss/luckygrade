<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette</title>
<meta name="description" content="Roulette — апгрейд скинов с шансом до 80%. Крути колесо, забирай множитель, получай кэшбек при проигрыше.">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0d0d10;
        --bg2: #131318;
        --line: #1f1f26;
        --line2: #2a2a33;
        --text: #e8e8ec;
        --muted: #6b6b78;
        --dim: #3a3a44;
        --red: #c23a2b;
        --red-bright: #e54a35;
        --gold: #c9942c;
        --green: #6fa32c;
        --arrow: #c23a2b;
    }

    html, body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ============ ХЕДЕР ============ */
    .header {
        width: 100%;
        max-width: 1080px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 12px 18px;
        background: var(--bg2);
        border: 1px solid var(--line);
        margin-bottom: 24px;
    }
    .user-block { display: flex; align-items: center; gap: 10px; }
    .avatar {
        width: 32px; height: 32px;
        background: var(--red);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 13px; color: #fff;
        flex-shrink: 0;
    }
    .nick-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .admin-tag {
        background: var(--red); color: #fff;
        font-size: 9px; font-weight: 700;
        padding: 2px 5px;
        text-transform: uppercase; letter-spacing: 0.8px;
    }
    .nick {
        font-weight: 600; font-size: 14px; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tabs {
        display: flex; gap: 0;
        background: var(--bg);
        border: 1px solid var(--line);
    }
    .tabs button {
        padding: 8px 20px;
        background: transparent; border: none;
        color: var(--muted);
        font-size: 12px; font-weight: 600;
        font-family: inherit;
        text-transform: uppercase; letter-spacing: 1.2px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        border-right: 1px solid var(--line);
    }
    .tabs button:last-child { border-right: none; }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { background: var(--red); color: #fff; }
    .balance-block {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    .balance-block b {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px; font-weight: 700;
        color: var(--green);
        letter-spacing: 0; margin-top: 2px;
    }
    .balance-block b.zero { color: var(--red); }

    /* ============ ЭКРАНЫ ============ */
    .screen { display: none; width: 100%; }
    .screen.active { display: block; }

    /* ============ ИГРА ============ */
    .game {
        display: flex; flex-direction: column; align-items: center;
        gap: 22px;
        max-width: 1080px; margin: 0 auto;
    }
    .wheel-wrap {
        position: relative;
        width: 360px; height: 360px;
        flex-shrink: 0;
        margin-top: 20px;
    }
    .wheel-svg {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        overflow: visible;
    }
    .wheel-info {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        pointer-events: none;
    }
    .wheel-pct {
        font-family: 'JetBrains Mono', monospace;
        font-size: 44px; font-weight: 700;
        color: var(--text); line-height: 1;
        letter-spacing: -1px;
    }
    .wheel-state {
        font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 3px;
        margin-top: 10px; color: var(--muted);
    }
    .wheel-state.safe { color: var(--green); }
    .wheel-state.danger { color: var(--red-bright); }

    .arrow-rot {
        position: absolute;
        top: 50%; left: 50%;
        width: 0; height: 0;
        transform-origin: 0 0;
        transition: transform 6s cubic-bezier(0.15, 0.85, 0.25, 1);
        z-index: 10;
        pointer-events: none;
    }
    .arrow {
        position: absolute;
        left: -10px;
        bottom: 172px;
        width: 0; height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 22px solid var(--arrow);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    /* ============ ПАНЕЛЬ ============ */
    .panel {
        display: grid;
        grid-template-columns: 1.3fr 1.5fr 1fr;
        gap: 8px;
        width: 100%; height: 72px;
    }
    .bet-panel {
        background: var(--bg2);
        border: 1px solid var(--line);
        padding: 12px 16px;
        display: flex; flex-direction: column;
        justify-content: center; gap: 10px;
    }
    .bet-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 1px;
        color: var(--muted);
    }
    .bet-val {
        display: flex; align-items: baseline; gap: 6px;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text); font-size: 13px;
        letter-spacing: 0;
    }
    .bet-val .max { color: var(--dim); font-size: 11px; }

    .slider {
        position: relative;
        width: 100%; height: 20px;
        cursor: grab;
        display: flex; align-items: center;
        touch-action: none;
    }
    .slider:active { cursor: grabbing; }
    .slider::before {
        content: '';
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 3px;
        transform: translateY(-50%);
        background: var(--line2);
    }
    .slider-fill {
        position: absolute;
        left: 0; top: 50%;
        height: 3px;
        transform: translateY(-50%);
        background: var(--red);
        width: 0%;
        pointer-events: none;
    }
    .slider-knob {
        position: absolute;
        top: 50%;
        width: 12px; height: 12px;
        background: var(--text);
        transform: translate(-50%, -50%);
        left: 0%;
        pointer-events: none;
        transition: background 0.15s;
    }
    .slider:hover .slider-knob { background: var(--red-bright); }

    .upgrade {
        background: #1a0f0d;
        border: 1px solid #3a1a15;
        color: #6a3028;
        font-family: inherit;
        font-size: 20px; font-weight: 900;
        letter-spacing: 3px; text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s;
        height: 100%;
    }
    .upgrade:hover:not(:disabled) {
        background: var(--red);
        color: #fff;
        border-color: var(--red-bright);
    }
    .upgrade:disabled { opacity: 0.35; cursor: not-allowed; }

    .mult-panel {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px; height: 100%;
    }
    .mult {
        background: var(--bg2);
        border: 1px solid var(--line);
        color: var(--muted);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px; font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        padding: 0; height: 100%;
    }
    .mult:hover {
        background: var(--line);
        color: var(--text);
        border-color: var(--line2);
    }
    .mult.p35 { border-color: #4a2420; color: #a04a3a; }
    .mult.p35:hover { background: #1a0f0d; color: var(--red-bright); border-color: var(--red); }
    .mult.p55 { border-color: #4a3a15; color: #a08030; }
    .mult.p55:hover { background: #1a1408; color: var(--gold); border-color: var(--gold); }
    .mult.p75 { border-color: #2a3a15; color: #7a9a3a; }
    .mult.p75:hover { background: #0f1408; color: var(--green); border-color: var(--green); }

    .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        width: 100%;
        padding: 12px 18px;
        background: var(--bg2);
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        height: 44px;
        align-items: center;
    }
    .stats .item { display: flex; gap: 8px; align-items: baseline; }
    .stats .item span {
        font-family: 'JetBrains Mono', monospace;
        color: var(--text); font-weight: 700;
        letter-spacing: 0;
    }
    .stats .result {
        grid-column: 5;
        text-align: right;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 12px;
    }
    .stats .result.win { color: var(--green); }
    .stats .result.lose { color: var(--red-bright); }

    /* ============ КАРТОЧКИ ============ */
    .cards {
        max-width: 640px; margin: 0 auto;
        display: flex; flex-direction: column; gap: 12px;
    }
    .card {
        background: var(--bg2);
        border: 1px solid var(--line);
        padding: 22px;
    }
    .card h3 {
        font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 2px;
        color: var(--red); margin-bottom: 18px;
    }
    .field {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
    }
    .field:last-child { margin-bottom: 0; }
    .field label {
        font-size: 12px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 1px;
        width: 140px; flex-shrink: 0;
    }
    .field input[type="text"] {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 10px 14px;
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        outline: none;
        transition: border 0.15s;
        user-select: text;
    }
    .field input[type="text"]:focus { border-color: var(--red); }

    .btn {
        background: var(--red);
        border: none;
        padding: 10px 22px;
        color: #fff;
        font-family: inherit;
        font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1.5px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .btn:hover { background: var(--red-bright); }
    .btn.green { background: var(--green); }
    .btn.green:hover { background: #85c035; }

    .promo-row { display: flex; gap: 8px; }
    .promo-row input { flex: 1; }
    .promo-msg {
        margin-top: 10px;
        font-size: 12px;
        font-family: 'JetBrains Mono', monospace;
        min-height: 16px;
    }
    .promo-msg.ok { color: var(--green); }
    .promo-msg.err { color: var(--red-bright); }

    .color-row {
        display: flex; gap: 8px; flex-wrap: wrap;
        margin-top: 12px;
    }
    .color-dot {
        width: 32px; height: 32px;
        border: 1px solid var(--line2);
        cursor: pointer;
        transition: transform 0.12s, border-color 0.12s;
        padding: 0;
    }
    .color-dot:hover { transform: scale(1.1); border-color: var(--text); }
    .color-dot.active { border-color: var(--text); border-width: 2px; }

    .toggle-row {
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 8px 0;
    }
    .toggle-row span {
        font-size: 12px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 1px;
    }
    .toggle {
        width: 44px; height: 24px;
        background: var(--line);
        border: 1px solid var(--line2);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
    }
    .toggle::after {
        content: '';
        position: absolute;
        top: 2px; left: 2px;
        width: 18px; height: 18px;
        background: var(--muted);
        transition: transform 0.15s, background 0.15s;
    }
    .toggle.on { background: #2a1a15; border-color: var(--red); }
    .toggle.on::after {
        transform: translateX(18px);
        background: var(--red);
    }

    /* ============ КРАШ ============ */
    .crash-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        backdrop-filter: blur(8px);
        flex-direction: column;
    }
    .crash-overlay.active { display: flex; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .crash-text {
        font-family: 'Inter', sans-serif;
        font-size: 96px; font-weight: 900;
        color: var(--red-bright);
        letter-spacing: -3px;
        text-transform: uppercase;
        animation: shake 0.4s;
        text-shadow: 0 0 40px rgba(229, 74, 53, 0.8);
    }
    @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-6px, 4px); }
        40% { transform: translate(6px, -4px); }
        60% { transform: translate(-4px, -6px); }
        80% { transform: translate(4px, 6px); }
    }
    .crash-sub {
        margin-top: 16px;
        font-size: 16px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 500;
    }
    .crash-info {
        margin-top: 32px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: var(--text);
        text-align: center;
        line-height: 2;
    }
    .crash-info b { color: var(--gold); }
    .crash-restart {
        margin-top: 40px;
        background: var(--red);
        border: none;
        padding: 14px 40px;
        color: #fff;
        font-family: inherit;
        font-size: 13px; font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 3px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .crash-restart:hover { background: var(--red-bright); }

    @media (max-width: 760px) {
        .header { grid-template-columns: 1fr auto; }
        .balance-block { grid-column: 1 / -1; text-align: left; margin-top: 10px; }
        .panel { grid-template-columns: 1fr; height: auto; }
        .upgrade { min-height: 64px; }
        .mult-panel { min-height: 56px; }
        .wheel-wrap { width: 280px; height: 280px; }
        .arrow { bottom: 132px; }
        .wheel-pct { font-size: 34px; }
        .stats { grid-template-columns: 1fr 1fr; gap: 4px; height: auto; }
        .stats .result { grid-column: 1 / -1; text-align: left; }
        .crash-text { font-size: 56px; }
    }
</style>
</head>
<body>

<div class="header">
    <div class="user-block">
        <div class="avatar" id="avatarLetter">?</div>
        <div class="nick-wrap">
            <span class="admin-tag" id="adminTag" style="display:none;">ADMIN</span>
            <span class="nick" id="nickDisplay">Гость</span>
        </div>
    </div>
    <div class="tabs">
        <button class="active" data-tab="main">Игра</button>
        <button data-tab="profile">Профиль</button>
        <button data-tab="settings">Настройки</button>
    </div>
    <div class="balance-block">
        Баланс
        <b id="balanceTop">1000.00</b>
    </div>
</div>

<div class="screen active" id="screen-main">
    <div class="game">
        <div class="wheel-wrap">
            <svg class="wheel-svg" viewBox="0 0 360 360">
                <defs>
                    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#26262e"/>
                        <stop offset="100%" stop-color="#14141a"/>
                    </linearGradient>
                    <linearGradient id="winGrad" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="#c23a2b"/>
                        <stop offset="50%" stop-color="#d4782c"/>
                        <stop offset="100%" stop-color="#c9942c"/>
                    </linearGradient>
                </defs>
                <circle cx="180" cy="180" r="165" fill="none" stroke="url(#ringGrad)" stroke-width="28"/>
                <path id="winArc" fill="none" stroke="url(#winGrad)" stroke-width="28"/>
                <circle cx="180" cy="180" r="142" fill="#14141a"/>
                <circle cx="180" cy="180" r="142" fill="none" stroke="var(--line)" stroke-width="1"/>
            </svg>
            <div class="wheel-info">
                <div class="wheel-pct" id="wheelPct">80.00%</div>
                <div class="wheel-state safe" id="wheelState">Безопасно</div>
            </div>
            <div class="arrow-rot" id="arrowRot">
                <div class="arrow"></div>
            </div>
        </div>

        <div class="panel">
            <div class="bet-panel">
                <div class="bet-top">
                    <span>Ставка</span>
                    <span class="bet-val">
                        <span id="betVal">100.00</span>
                        <span class="max" id="betMax">(макс 1000.00)</span>
                    </span>
                </div>
                <div class="slider" id="slider">
                    <div class="slider-fill" id="sliderFill"></div>
                    <div class="slider-knob" id="sliderKnob"></div>
                </div>
            </div>

            <button class="upgrade" id="spinBtn">Апгрейд</button>

            <div class="mult-panel">
                <button class="mult" onclick="applyMult(2)">x2</button>
                <button class="mult" onclick="applyMult(4)">x4</button>
                <button class="mult" onclick="applyMult(8)">x8</button>
                <button class="mult p35" onclick="applyPercent(35)">35%</button>
                <button class="mult p55" onclick="applyPercent(55)">55%</button>
                <button class="mult p75" onclick="applyPercent(75)">75%</button>
            </div>
        </div>

        <div class="stats">
            <div class="item">Ставка <span id="statBet">100.00</span></div>
            <div class="item">Выигрыш <span id="statWin">125.00</span></div>
            <div class="item">Шанс <span id="statChance">80.00%</span></div>
            <div class="item">Множитель <span id="statMult">x1.25</span></div>
            <div class="result" id="statResult"></div>
        </div>
    </div>
</div>

<div class="screen" id="screen-profile">
    <div class="cards">
        <div class="card">
            <h3>Профиль</h3>
            <div class="field">
                <label>Никнейм</label>
                <input type="text" id="nickInput" placeholder="Введи ник" maxlength="20">
            </div>
            <button class="btn green" onclick="saveNick()">Сохранить</button>
        </div>
        <div class="card">
            <h3>Промокод</h3>
            <div class="promo-row">
                <input type="text" id="promoInput" placeholder="Введи промокод">
                <button class="btn" onclick="applyPromo()">Активировать</button>
            </div>
            <div class="promo-msg" id="promoMsg"></div>
        </div>
    </div>
</div>

<div class="screen" id="screen-settings">
    <div class="cards">
        <div class="card">
            <h3>Цвет стрелки</h3>
            <div class="field">
                <label>Свой цвет</label>
                <input type="color" id="customColor" value="#c23a2b" style="width:80px; height:40px; background:transparent; border:1px solid var(--line); cursor:pointer; padding:2px;">
            </div>
            <div class="color-row" id="colorRow">
                <button class="color-dot" data-color="#c23a2b" style="background:#c23a2b"></button>
                <button class="color-dot" data-color="#e54a35" style="background:#e54a35"></button>
                <button class="color-dot" data-color="#c9942c" style="background:#c9942c"></button>
                <button class="color-dot" data-color="#6fa32c" style="background:#6fa32c"></button>
                <button class="color-dot" data-color="#3a8fc2" style="background:#3a8fc2"></button>
                <button class="color-dot" data-color="#8a3ac2" style="background:#8a3ac2"></button>
                <button class="color-dot" data-color="#c23a7a" style="background:#c23a7a"></button>
                <button class="color-dot" data-color="#e8e8ec" style="background:#e8e8ec"></button>
            </div>
        </div>
        <div class="card">
            <h3>Прокрутка</h3>
            <div class="toggle-row">
                <span>Быстрая прокрутка</span>
                <div class="toggle" id="fastToggle"></div>
            </div>
        </div>
        <div class="card">
            <h3>Звук</h3>
            <div class="toggle-row">
                <span>Звуковые эффекты</span>
                <div class="toggle on" id="soundToggle"></div>
            </div>
        </div>
    </div>
</div>

<div class="crash-overlay" id="crashOverlay">
    <div class="crash-text">КРАХ</div>
    <div class="crash-sub">Баланс обнулён</div>
    <div class="crash-info">
        Ставка: <b id="crashBet">0</b><br>
        Итог: <b id="crashResult">0</b>
    </div>
    <button class="crash-restart" onclick="restartAfterCrash()">Начать заново</button>
</div>

<script>
const $ = id => document.getElementById(id);

// ============================================================
// ЗВУКИ (Web Audio API — без файлов)
// ============================================================
const Sound = (() => {
    let ctx = null;
    let enabled = true;

    function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function tone(freq, duration, type = 'sine', volume = 0.15, when = 0) {
        if (!enabled) return;
        const c = getCtx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, c.currentTime + when);
        gain.gain.setValueAtTime(0, c.currentTime + when);
        gain.gain.linearRampToValueAtTime(volume, c.currentTime + when + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + when + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(c.currentTime + when);
        osc.stop(c.currentTime + when + duration + 0.02);
    }

    function noise(duration, volume = 0.1) {
        if (!enabled) return;
        const c = getCtx();
        const bufferSize = Math.floor(c.sampleRate * duration);
        const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
        }
        const source = c.createBufferSource();
        source.buffer = buffer;
        const gain = c.createGain();
        gain.gain.value = volume;
        source.connect(gain);
        gain.connect(c.destination);
        source.start();
    }

    return {
        setEnabled(v) { enabled = v; },
        isEnabled() { return enabled; },
        resume() { getCtx(); },

        click() { tone(800, 0.05, 'square', 0.06); },

        tick(intensity = 1) {
            tone(1200 + Math.random() * 300, 0.03, 'square', 0.04 * intensity);
        },

        win() {
            if (!enabled) return;
            const c = getCtx();
            const bursts = [
                { time: 0.00, vol: 0.22, dur: 0.35 },
                { time: 0.18, vol: 0.18, dur: 0.30 },
                { time: 0.42, vol: 0.25, dur: 0.40 },
                { time: 0.68, vol: 0.16, dur: 0.28 },
                { time: 0.95, vol: 0.20, dur: 0.35 },
                { time: 1.20, vol: 0.14, dur: 0.25 },
            ];
            bursts.forEach(b => {
                const bufSize = Math.floor(c.sampleRate * b.dur);
                const buffer = c.createBuffer(1, bufSize, c.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) {
                    const t = i / bufSize;
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5);
                }
                const src = c.createBufferSource();
                src.buffer = buffer;
                const filt = c.createBiquadFilter();
                filt.type = 'lowpass';
                filt.frequency.setValueAtTime(2000, c.currentTime + b.time);
                filt.frequency.exponentialRampToValueAtTime(200, c.currentTime + b.time + b.dur);
                const gain = c.createGain();
                gain.gain.setValueAtTime(0, c.currentTime + b.time);
                gain.gain.linearRampToValueAtTime(b.vol, c.currentTime + b.time + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + b.time + b.dur);
                src.connect(filt);
                filt.connect(gain);
                gain.connect(c.destination);
                src.start(c.currentTime + b.time);
                src.stop(c.currentTime + b.time + b.dur + 0.05);

                const boom = c.createOscillator();
                const boomGain = c.createGain();
                boom.type = 'sine';
                boom.frequency.setValueAtTime(120, c.currentTime + b.time);
                boom.frequency.exponentialRampToValueAtTime(40, c.currentTime + b.time + 0.3);
                boomGain.gain.setValueAtTime(0, c.currentTime + b.time);
                boomGain.gain.linearRampToValueAtTime(b.vol * 0.8, c.currentTime + b.time + 0.01);
                boomGain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + b.time + 0.35);
                boom.connect(boomGain);
                boomGain.connect(c.destination);
                boom.start(c.currentTime + b.time);
                boom.stop(c.currentTime + b.time + 0.4);

                const echoDelay = 0.15;
                const echoSrc = c.createBufferSource();
                echoSrc.buffer = buffer;
                const echoFilt = c.createBiquadFilter();
                echoFilt.type = 'lowpass';
                echoFilt.frequency.value = 800;
                const echoGainNode = c.createGain();
                echoGainNode.gain.setValueAtTime(b.vol * 0.35, c.currentTime + b.time + echoDelay);
                echoGainNode.gain.exponentialRampToValueAtTime(0.001, c.currentTime + b.time + echoDelay + b.dur);
                echoSrc.connect(echoFilt);
                echoFilt.connect(echoGainNode);
                echoGainNode.connect(c.destination);
                echoSrc.start(c.currentTime + b.time + echoDelay);
                echoSrc.stop(c.currentTime + b.time + echoDelay + b.dur + 0.05);

                const echo2 = c.createBufferSource();
                echo2.buffer = buffer;
                const echo2Gain = c.createGain();
                echo2Gain.gain.setValueAtTime(b.vol * 0.15, c.currentTime + b.time + echoDelay * 2);
                echo2Gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + b.time + echoDelay * 2 + b.dur);
                echo2.connect(echo2Gain);
                echo2Gain.connect(c.destination);
                echo2.start(c.currentTime + b.time + echoDelay * 2);
                echo2.stop(c.currentTime + b.time + echoDelay * 2 + b.dur + 0.05);
            });
            tone(880, 0.5, 'triangle', 0.08, 1.4);
            tone(1174, 0.6, 'triangle', 0.06, 1.5);
            tone(1568, 0.8, 'triangle', 0.05, 1.6);
        },

        lose() {
            tone(400, 0.15, 'sawtooth', 0.12, 0);
            tone(300, 0.2, 'sawtooth', 0.12, 0.1);
            tone(200, 0.35, 'sawtooth', 0.1, 0.25);
        },

        cashback() {
            tone(1200, 0.08, 'triangle', 0.15, 0);
            tone(1500, 0.08, 'triangle', 0.15, 0.08);
            tone(1800, 0.15, 'triangle', 0.15, 0.16);
        },

        crash() {
            noise(0.5, 0.2);
            tone(80, 0.8, 'sawtooth', 0.2, 0);
            tone(60, 1.0, 'sawtooth', 0.15, 0.1);
            tone(40, 1.2, 'sine', 0.15, 0.2);
        },

        startSpinTicks(durationMs) {
            if (!enabled) return;
            let stopped = false;
            const startTime = performance.now();
            const tickFn = () => {
                if (stopped) return;
                const elapsed = performance.now() - startTime;
                if (elapsed > durationMs) return;
                const progress = elapsed / durationMs;
                const delay = 30 + Math.pow(progress, 3) * 400;
                Sound.tick(0.5 + progress * 0.5);
                setTimeout(tickFn, delay);
            };
            setTimeout(tickFn, 30);
            return () => { stopped = true; };
        },
    };
})();

// ============================================================
// ИГРА
// ============================================================
let bet = 100;
let win = 125;
let spinning = false;
let rotation = 0;

const state = {
    balance: 1000,
    nickname: '',
    isAdmin: false,
    usedPromos: [],
    arrowColor: '#c23a2b',
    fastSpin: false,
    soundOn: true,
    pending: null,
};

const LS_KEY = 'roulette_state_v3';

function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}
function load() {
    try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) Object.assign(state, JSON.parse(raw));
    } catch(e) {}
}

function update() {
    $('balanceTop').textContent = state.balance.toFixed(2);
    $('balanceTop').classList.toggle('zero', state.balance <= 0);
    $('nickDisplay').textContent = state.nickname || 'Гость';
    $('avatarLetter').textContent = (state.nickname || '?').charAt(0).toUpperCase();
    $('adminTag').style.display = state.isAdmin ? 'inline-block' : 'none';
    updateWheel();
    updateStats();
    updateSlider();
}

function updateStats() {
    $('betVal').textContent = bet.toFixed(2);
    $('statBet').textContent = bet.toFixed(2);
    $('statWin').textContent = win.toFixed(2);

    const chance = getChance();
    if (chance > 0) {
        $('statChance').textContent = chance.toFixed(2) + '%';
        $('statMult').textContent = 'x' + (100 / chance).toFixed(2);
    } else {
        $('statChance').textContent = '—';
        $('statMult').textContent = '—';
    }
}

function updateSlider() {
    const max = Math.max(state.balance, 1);
    const pct = Math.max(0, Math.min(100, (bet / max) * 100));
    $('sliderFill').style.width = pct + '%';
    $('sliderKnob').style.left = pct + '%';
    $('betMax').textContent = '(макс ' + max.toFixed(2) + ')';
}

function getChance() {
    if (bet <= 0 || win <= 0) return 0;
    let c = (bet / win) * 100;
    if (c > 80) c = 80;
    return c;
}

const CX = 180, CY = 180, R = 165;

function arcPath(a1, a2) {
    const s = (a1 - 90) * Math.PI / 180;
    const e = (a2 - 90) * Math.PI / 180;
    const x1 = CX + R * Math.cos(s);
    const y1 = CY + R * Math.sin(s);
    const x2 = CX + R * Math.cos(e);
    const y2 = CY + R * Math.sin(e);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}`;
}

function updateWheel() {
    const chance = getChance();
    const arc = $('winArc');

    if (chance <= 0) {
        $('wheelPct').textContent = '—';
        $('wheelState').textContent = '—';
        $('wheelState').className = 'wheel-state';
        arc.setAttribute('d', '');
        $('spinBtn').disabled = true;
        return;
    }

    $('wheelPct').textContent = chance.toFixed(2) + '%';

    const half = (chance / 100) * 180;
    arc.setAttribute('d', arcPath(180 - half, 180 + half));

    if (chance >= 50) {
        $('wheelState').textContent = 'Безопасно';
        $('wheelState').className = 'wheel-state safe';
    } else {
        $('wheelState').textContent = 'Опасно';
        $('wheelState').className = 'wheel-state danger';
    }

    $('spinBtn').disabled = spinning || chance > 80;
}

function applyMult(m) {
    Sound.resume();
    Sound.click();
    win = bet * m;
    if ((bet / win) * 100 > 80) win = bet * (100 / 80);
    update();
}
function applyPercent(p) {
    Sound.resume();
    Sound.click();
    win = bet * (100 / p);
    update();
}

function showResult(text, win_) {
    $('statResult').textContent = text;
    $('statResult').className = 'result ' + (win_ ? 'win' : 'lose');
}

// ============================================================
// SPIN — результат считается СРАЗУ, анимация отдельно
// ============================================================
function spin() {
    if (spinning) return;
    if (bet <= 0) return;
    if (Math.round(bet * 100) > Math.round(state.balance * 100)) {
        showResult('Мало средств', false); return;
    }
    if (win <= bet) { showResult('Выигрыш > ставки', false); return; }

    const chance = getChance();
    if (chance > 80) { showResult('Шанс > 80%', false); return; }

    Sound.resume();

    // ============ 1. ОПРЕДЕЛЯЕМ РЕЗУЛЬТАТ СРАЗУ ============
    const isWin = Math.random() * 100 < chance;
    const payout = isWin ? bet * (100 / chance) : 0;

    // ============ 2. СПИСЫВАЕМ/НАЧИСЛЯЕМ СРАЗУ ============
    state.balance -= bet;
    if (isWin) state.balance += payout;

    // ============ 3. СЧИТАЕМ УГОЛ ДЛЯ АНИМАЦИИ ============
    const half = (chance / 100) * 180;
    let target;
    if (isWin) {
        target = (180 - half) + Math.random() * (2 * half);
    } else {
        if (Math.random() < 0.5) target = Math.random() * (180 - half);
        else target = (180 + half) + Math.random() * (180 - half);
    }

    const turns = 5 + Math.floor(Math.random() * 3);
    const norm = ((rotation % 360) + 360) % 360;
    let delta = target - norm;
    if (delta < 0) delta += 360;
    rotation += turns * 360 + delta;

    // ============ 4. СОХРАНЯЕМ PENDING (для восстановления после обновления) ============
    state.pending = {
        bet: bet,
        win: win,
        chance: chance,
        isWin: isWin,
        payout: payout,
        rotation: rotation,
        timestamp: Date.now(),
    };
    save();
    update();

    // ============ 5. ПРОИГРЫВАЕМ АНИМАЦИЮ ============
    spinning = true;
    $('spinBtn').disabled = true;
    $('statResult').textContent = '';
    $('statResult').className = 'result';

    $('arrowRot').style.transform = `rotate(${rotation}deg)`;

    const duration = state.fastSpin ? 3000 : 6000;
    Sound.startSpinTicks(duration);

    setTimeout(() => {
        spinning = false;
        $('spinBtn').disabled = false;

        if (isWin) {
            showResult('+' + payout.toFixed(2), true);
            Sound.win();
        } else {
            showResult('-' + bet.toFixed(2), false);
            Sound.lose();
            if (bet >= 5000 && state.balance > 0) triggerCashback(bet);
        }

        // Очищаем pending
        state.pending = null;
        save();

        // Проверяем краш
        if (state.balance < 1) {
            if (state.balance < 0) { state.balance = 0; save(); update(); }
            setTimeout(() => triggerCrash(bet), 600);
        }
    }, duration + 100);
}

// ============================================================
// КЭШБЕК
// ============================================================
function triggerCashback(b) {
    const roll = Math.random() * 100;
    let pct = 0;
    if (roll < 50) pct = 3;
    else if (roll < 70) pct = 5;
    else if (roll < 71) pct = 15;
    if (pct === 0) return;

    const amount = b * (pct / 100);
    state.balance += amount;
    save();
    update();
    showResult('Кэшбек +' + amount.toFixed(2), true);
    Sound.cashback();
}

// ============================================================
// КРАШ
// ============================================================
function triggerCrash(b) {
    $('crashBet').textContent = b.toFixed(2);
    $('crashResult').textContent = state.balance.toFixed(2);
    $('crashOverlay').classList.add('active');
    Sound.crash();
}

function restartAfterCrash() {
    state.balance = 1000;
    state.nickname = '';
    state.isAdmin = false;
    state.usedPromos = [];
    state.pending = null;
    bet = 100;
    win = 125;
    save();
    $('crashOverlay').classList.remove('active');
    $('nickInput').value = '';
    update();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelector('[data-tab="main"]').classList.add('active');
    $('screen-main').classList.add('active');
}

// ============================================================
// ПОЛЗУНОК
// ============================================================
const slider = $('slider');
let dragging = false;

function setBetFromPointer(clientX) {
    const rect = slider.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const max = Math.max(state.balance, 1);
    bet = Math.max(0.01, Math.round(max * pct * 100) / 100);
    update();
}

slider.addEventListener('pointerdown', e => {
    dragging = true;
    slider.setPointerCapture(e.pointerId);
    setBetFromPointer(e.clientX);
    e.preventDefault();
});
slider.addEventListener('pointermove', e => {
    if (!dragging) return;
    setBetFromPointer(e.clientX);
    e.preventDefault();
});
slider.addEventListener('pointerup', e => {
    dragging = false;
    try { slider.releasePointerCapture(e.pointerId); } catch(err) {}
});

// ============================================================
// ВКЛАДКИ
// ============================================================
document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
        Sound.resume();
        Sound.click();
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        $('screen-' + btn.dataset.tab).classList.add('active');
    });
});

// ============================================================
// ПРОФИЛЬ
// ============================================================
function saveNick() {
    const v = $('nickInput').value.trim();
    if (v.length < 1) return alert('Введи ник');
    state.nickname = v;
    save();
    update();
    alert('Ник сохранён: ' + v);
}

// ============================================================
// ПРОМОКОД
// ============================================================
function applyPromo() {
    const code = $('promoInput').value.trim();
    const msg = $('promoMsg');
    Sound.resume();

    if (code === 'TEST-5106') {
        if (state.usedPromos.includes('TEST-5106')) {
            msg.textContent = 'Промокод уже использован';
            msg.className = 'promo-msg err';
            return;
        }
        state.balance += 10000;
        state.isAdmin = true;
        state.usedPromos.push('TEST-5106');
        save();
        update();
        msg.textContent = 'Активировано. +10000, статус ADMIN';
        msg.className = 'promo-msg ok';
        $('promoInput').value = '';
        Sound.win();
        return;
    }
    msg.textContent = 'Неверный промокод';
    msg.className = 'promo-msg err';
}

// ============================================================
// НАСТРОЙКИ
// ============================================================
function setArrowColor(color) {
    state.arrowColor = color;
    document.documentElement.style.setProperty('--arrow', color);
    $('customColor').value = color;
    document.querySelectorAll('.color-dot').forEach(d => {
        d.classList.toggle('active', d.dataset.color === color);
    });
    save();
}

$('customColor').addEventListener('input', e => setArrowColor(e.target.value));
document.querySelectorAll('.color-dot').forEach(d => {
    d.addEventListener('click', () => { Sound.resume(); Sound.click(); setArrowColor(d.dataset.color); });
});

$('fastToggle').addEventListener('click', () => {
    state.fastSpin = !state.fastSpin;
    $('fastToggle').classList.toggle('on', state.fastSpin);
    $('arrowRot').style.transition = state.fastSpin
        ? 'transform 3s cubic-bezier(0.15, 0.85, 0.25, 1)'
        : 'transform 6s cubic-bezier(0.15, 0.85, 0.25, 1)';
    Sound.resume();
    Sound.click();
    save();
});

$('soundToggle').addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    $('soundToggle').classList.toggle('on', state.soundOn);
    Sound.setEnabled(state.soundOn);
    if (state.soundOn) { Sound.resume(); Sound.click(); }
    save();
});

// ============================================================
// СТАРТ
// ============================================================
load();

document.documentElement.style.setProperty('--arrow', state.arrowColor);
$('customColor').value = state.arrowColor;
document.querySelectorAll('.color-dot').forEach(d => {
    d.classList.toggle('active', d.dataset.color === state.arrowColor);
});
$('fastToggle').classList.toggle('on', state.fastSpin);
if (state.fastSpin) {
    $('arrowRot').style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.25, 1)';
}
$('soundToggle').classList.toggle('on', state.soundOn !== false);
Sound.setEnabled(state.soundOn !== false);
$('nickInput').value = state.nickname;

// ============ ВОССТАНОВЛЕНИЕ ПОСЛЕ ОБНОВЛЕНИЯ ============
if (state.pending) {
    const p = state.pending;

    // Ставим стрелку сразу на финальный угол (без анимации)
    $('arrowRot').style.transition = 'none';
    $('arrowRot').style.transform = `rotate(${p.rotation}deg)`;
    rotation = p.rotation;

    // Сбрасываем анимацию на будущее
    setTimeout(() => {
        $('arrowRot').style.transition = state.fastSpin
            ? 'transform 3s cubic-bezier(0.15, 0.85, 0.25, 1)'
            : 'transform 6s cubic-bezier(0.15, 0.85, 0.25, 1)';
    }, 100);

    // Показываем результат через маленькую задержку
    setTimeout(() => {
        if (p.isWin) {
            showResult('+' + p.payout.toFixed(2), true);
        } else {
            showResult('-' + p.bet.toFixed(2), false);
        }
    }, 300);

    // Очищаем pending
    state.pending = null;
    save();

    // Проверяем краш
    if (state.balance < 1) {
        if (state.balance < 0) state.balance = 0;
        setTimeout(() => triggerCrash(p.bet), 600);
    }
}

update();
$('spinBtn').addEventListener('click', spin);
</script>
